# pnpm 12: Build-Skript-Freigaben (Postinstall) für native Pakete
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  workerd: true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@prisma/composer-cli@0.34.0"
  - "@prisma/composer@0.34.0"
  - prisma@8.0.0-rc.27
